<ng-container>
  @if (FormAssignmentTable) {
    <ng-dhis2-ui-wrapper
      [component]="FormAssignmentTable"
    ></ng-dhis2-ui-wrapper>
  }
  @if (showOrgUnit$ | async) {
    <ng-dhis2-ui-org-unit-selector-modal
      class="org-unit-modal"
      [selectedOrgUnits]="(orgUnitSelections$ | async) || []"
      (cancel)="onCloseOrgUnit()"
      (confirm)="onSelectOrgUnit($event)"
    ></ng-dhis2-ui-org-unit-selector-modal>
  }
</ng-container>
